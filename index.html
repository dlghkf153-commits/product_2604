<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추천기</title>
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>로또 번호 추천</h1>
    <div id="lotto-numbers" class="numbers-container">
      <div class="ball placeholder">?</div>
      <div class="ball placeholder">?</div>
      <div class="ball placeholder">?</div>
      <div class="ball placeholder">?</div>
      <div class="ball placeholder">?</div>
      <div class="ball placeholder">?</div>
    </div>
    <div class="fixed-numbers-container">
      <label for="fixed-input">고정 숫자 (쉼표로 구분, 최대 6개):</label>
      <input type="text" id="fixed-input" placeholder="예: 7, 21, 33">
    </div>
    <button id="generate-btn">번호 생성하기</button>

    <hr class="divider">

    <div class="inquiry-container">
      <h2>제휴 문의</h2>
      <form action="https://formspree.io/f/mgodwbqn" method="POST" id="inquiry-form">
        <div class="form-group">
          <input type="text" name="name" placeholder="성함/업체명" required>
        </div>
        <div class="form-group">
          <input type="email" name="_replyto" placeholder="이메일 주소" required>
        </div>
        <div class="form-group">
          <textarea name="message" placeholder="문의 내용" required></textarea>
        </div>
        <button type="submit" id="submit-btn">문의 보내기</button>
      </form>
    </div>
  </div>
  <script defer src="/main.js"></script>
</body>
</html>
